<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1318">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anti-Moldu">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>L'Anti-Moldu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1318; --surface:#161C23; --surface-2:#1E262F; --line:#2A343F;
  --text:#E8ECF0; --muted:#8B97A4; --danger:#FF6B5B; --good:#3ddc84;
  --rank:#8a8f98; --rank-dark:#5d6168; --rank-ink:var(--rank); --on-rank:#0F1318;
  --display:'Big Shoulders Display','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tabs-h:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#E6EAEE; --surface:#FFFFFF; --surface-2:#F1F3F6; --line:#C8D0D9;
    --text:#111821; --muted:#55616F; --danger:#C9372C; --good:#16884A;
    --rank-ink:var(--rank-dark); color-scheme:light;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--body);overflow-x:hidden;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rank-ink);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;letter-spacing:.01em}
h1{font-size:40px}
h2{font-size:26px}
h3{font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack>*+*{margin-top:12px}
.stack-lg>*+*{margin-top:20px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap-ok{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* buttons */
.btn{min-height:48px;padding:0 18px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted)}
.iconbtn svg{width:24px;height:24px}

/* fields */
label.f{display:block}
label.f>span{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.in{width:100%;min-height:48px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:16px}
textarea.in{min-height:96px;resize:vertical;line-height:1.45}
.in:focus{border-color:var(--rank-ink);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:600}
.example{min-height:44px;padding:8px 12px;border:1px dashed var(--line);border-radius:6px;background:transparent;text-align:left;font-size:14px;color:var(--muted);width:100%}
.err{color:var(--danger);font-size:14px;min-height:1em}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card.accent{border-left:4px solid var(--rank)}
.card.warn{border-left:4px solid var(--danger)}
.sect{margin-top:28px}
.sect>h2{margin-bottom:12px}

/* onboarding */
.ob{min-height:100vh;display:flex;flex-direction:column;padding-bottom:24px}
.ob-top{position:sticky;top:0;background:var(--bg);z-index:5;padding:10px 0 12px}
.ob-bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.ob-bar>i{display:block;height:100%;background:var(--rank);transition:width .3s}
.ob-body{flex:1;padding-top:8px}
.ob-foot{display:flex;gap:10px;margin-top:24px}
.ob-foot .btn.primary{flex:1}
.hero{padding:6vh 0 20px}
.hero .big{font-family:var(--display);font-weight:900;font-size:min(30vw,132px);line-height:.85;color:var(--rank-ink)}
.hero h1{font-size:46px;margin-top:12px}
.opt{display:block;width:100%;min-height:48px;padding:10px 14px;margin-top:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);text-align:left;font-size:15px}
.opt[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 4px 0 0 var(--text);font-weight:600}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q>p{font-weight:600}
.pbar{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:15px}
.pbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.pbar .track>i{display:block;height:100%;background:var(--rank)}
.prop{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;margin-top:10px}
.prop[aria-pressed="true"]{border-color:var(--text);box-shadow:inset 0 0 0 1px var(--text)}
.prop .t{font-weight:600}
.val{font-family:var(--display);font-weight:800;font-size:20px}
.val .plus{color:var(--good)} .val .minus{color:var(--danger)}
.code{font-family:var(--display);font-weight:900;font-size:44px;letter-spacing:.12em;color:var(--rank-ink)}
.oath{font-size:17px;line-height:1.6;white-space:pre-line;border-left:4px solid var(--rank);padding-left:14px}

/* app shell */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;height:56px;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;flex:1}
.brand b{color:var(--rank-ink)}
main.wrap{padding-top:16px;padding-bottom:calc(var(--tabs-h) + 32px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:var(--tabs-h);padding:0 2px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;letter-spacing:-.01em;padding:0;color:var(--muted);min-width:0}
.tab svg{width:22px;height:22px}
.tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab[aria-current="page"]{color:var(--rank-ink);font-weight:700}

/* rank */
.rankcard{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:18px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center}
.scope{position:relative;width:148px;height:148px;display:flex;align-items:center;justify-content:center}
.aura{position:absolute;inset:-18px;border-radius:50%;background:radial-gradient(circle,var(--rank) 0,transparent 66%);opacity:.38;animation:pulse 2.8s ease-in-out infinite}
.ring{position:absolute;inset:4px;border-radius:50%;background:repeating-conic-gradient(var(--rank) 0 1.6deg,transparent 1.6deg 10deg);-webkit-mask:radial-gradient(circle,transparent 64%,#000 65%,#000 69%,transparent 70%);mask:radial-gradient(circle,transparent 64%,#000 65%,#000 69%,transparent 70%);opacity:.75}
.ring2{position:absolute;inset:0;border-radius:50%;border:1px solid var(--rank);opacity:.35}
.letter{position:relative;font-family:var(--display);font-weight:900;font-size:120px;line-height:1;color:var(--rank-ink);display:flex;align-items:flex-start}
.letter sup{font-size:52px;line-height:1;margin-left:2px;margin-top:6px}
@keyframes pulse{0%,100%{transform:scale(.92);opacity:.28}50%{transform:scale(1.06);opacity:.5}}
@media (prefers-reduced-motion: reduce){.aura{animation:none}.ob-bar>i{transition:none}.celebrate .letter{animation:none!important}}
.rk-name{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.rk-meta{color:var(--muted);font-size:14px;margin-top:6px}
.streak{display:inline-flex;align-items:baseline;gap:6px;margin-top:10px;font-size:14px;color:var(--muted)}
.streak b{font-family:var(--display);font-size:26px;color:var(--text)}
.gauges{grid-column:1/-1;margin-top:12px;display:grid;gap:12px}
.gauge .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
.gauge .lbl b{font-family:var(--display);font-weight:800;font-size:22px;color:var(--text);margin-right:4px}
.gauge .bar{height:12px;margin-top:4px;background:var(--surface-2);position:relative;-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(5% - 2px),transparent calc(5% - 2px) 5%);mask:repeating-linear-gradient(90deg,#000 0 calc(5% - 2px),transparent calc(5% - 2px) 5%)}
.gauge .bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--rank)}
@media (max-width:374px){.scope{width:120px;height:120px}.letter{font-size:96px}.letter sup{font-size:42px}.rk-name{font-size:26px}}

/* tasks */
.task{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;text-align:left;margin-top:8px}
.task .box{flex:none;width:30px;height:30px;border:2px solid var(--muted);border-radius:6px;display:flex;align-items:center;justify-content:center}
.task .box svg{width:18px;height:18px;opacity:0}
.task[aria-pressed="true"] .box{background:var(--rank);border-color:var(--rank);color:var(--on-rank)}
.task[aria-pressed="true"] .box svg{opacity:1}
.task[aria-pressed="true"] .tt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.task .tt{font-weight:600;line-height:1.3}
.task .tm{font-size:13px;color:var(--muted);margin-top:2px}
.task .pts{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);flex:none}
.daybar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.boost{font-size:17px;line-height:1.5}
.coachtxt p+p{margin-top:10px}
.coachtxt strong{font-weight:700}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tabs-h) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;width:min(448px,calc(100% - 32px));background:var(--text);color:var(--bg);border-radius:10px;padding:12px 14px;z-index:60;transition:opacity .2s,transform .2s;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .n{font-family:var(--display);font-weight:900;font-size:26px;flex:none}
.toast .m{font-size:15px;line-height:1.35}

/* ladder */
.ladder{display:grid;gap:4px}
.ladder .lr{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:10px;min-height:34px;padding:2px 10px;border-radius:6px}
.ladder .lr b{font-family:var(--display);font-weight:900;font-size:24px}
.ladder .lr.cur{background:var(--surface-2);box-shadow:inset 4px 0 0 var(--rank)}
.ladder .lr.past b{opacity:.55}
.ladder .lr.future{color:var(--muted)}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.hist li:first-child{border-top:0}

/* notes */
.note{padding:14px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.task .tt,.prop .t,.card{overflow-wrap:anywhere}
.note .nt{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin-top:6px}
.tag{display:inline-block;font-size:13px;padding:2px 8px;border-radius:10px;background:var(--surface-2);color:var(--muted);margin-left:6px}

/* mentor */
.mbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbtns .btn{padding:0 6px}
.chat{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.msg{max-width:88%;padding:12px 14px;border-radius:10px;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);white-space:pre-wrap}
.msg.coach{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--rank)}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:4px}
.composer{display:flex;gap:8px;margin-top:14px;align-items:flex-end}
.composer textarea{min-height:48px;height:48px}

/* group */
.member{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:8px}
.member.me{border-color:var(--rank);box-shadow:inset 4px 0 0 var(--rank)}
.member .ml{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;text-align:center}
.member .mn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.member .ms{font-size:13px;color:var(--muted)}
.member .mt{grid-column:2/-1}
.mini{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.mini>i{display:block;height:100%;background:var(--good)}
.member .mp{font-family:var(--display);font-weight:800;font-size:22px;text-align:right}
.member{cursor:pointer}
.member:focus-visible{outline:2px solid var(--rank);outline-offset:2px}
.member .mdetail{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.mdone{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:4px;font-size:14px}
#gchat{max-height:50vh;overflow-y:auto}
.msg.peer{align-self:flex-start;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap}
.msg.user .who{text-align:right}

/* sheet & overlay */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale .chip{padding:0;border-radius:6px}
.celebrate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:16px}
.celebrate .scope{width:220px;height:220px}
.celebrate .letter{font-size:170px;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
.celebrate .letter sup{font-size:70px}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--rank);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.list-plain{list-style:none;padding:0;margin:0}
.list-plain li{padding:10px 0;border-top:1px solid var(--line)}
.list-plain li:first-child{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{min-height:44px;min-width:56px;border:0;background:transparent;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
</style>
</head>

}

  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',

function rerenderKeepScroll(){ var y = window.scrollY; render(); window.scrollTo(0, y); }
// Bannière à l'ouverture de l'app : proposer d'activer les notifs (ou expliquer l'écran d'accueil sur iPhone).
var NOTIF_SNOOZE = "am_notif_snooze";
function notifBanner(){
  var snooze = 0; try { snooze = Number(localStorage.getItem(NOTIF_SNOOZE)) || 0; } catch(e){}
  if (Date.now() < snooze) return null;
  var later = el("button", {class:"btn ghost", text:t("notif_later"), onclick:function(){ try { localStorage.setItem(NOTIF_SNOOZE, String(Date.now() + 3 * 864e5)); } catch(e){} rerenderKeepScroll(); }});
  var wrap = {class:"banner", role:"status", style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap"};
  if (!pushSupported){
    if (!(isIOS && !isStandalone)) return null;
    return el("div", wrap, [el("span", {style:"flex:1 1 200px", text:t("notif_ios_hint")}), later]);
  }
  if ((notifPrefs().on && Notification.permission === "granted") || Notification.permission === "denied") return null;
  return el("div", wrap, [
    el("span", {style:"flex:1 1 200px", text: ui.notifErr || t("notif_banner")}),
    el("button", {class:"btn primary", disabled: !!ui.notifBusy, text: ui.notifBusy ? t("notif_busy") : t("notif_enable_short"), onclick: enableNotifs}),
    later
  ]);
}
function notifSection(){
  var s = el("section", {class:"sect"}, [el("h2", {text:t("notif_title")})]);
  if (!pushSupported){
    s.appendChild(el("p", {class:"small muted", style:"margin-top:6px", text: isIOS && !isStandalone ? t("notif_ios_hint") : t("notif_unsupported")}));
    return s;
  }
  var pr = notifPrefs(), on = pr.on && Notification.permission === "granted";
  if (!on){
    s.appendChild(el("p", {class:"small muted", style:"margin:6px 0 12px", text: Notification.permission === "denied" ? t("notif_blocked") : t("notif_pitch")}));
    s.appendChild(el("button", {class:"btn block primary", disabled: !!ui.notifBusy, text: ui.notifBusy ? t("notif_busy") : t("notif_enable"), onclick: enableNotifs}));
  } else {
    [["chat","notif_chat"],["remind","notif_remind"]].forEach(function(o){
      s.appendChild(el("div", {class:"row", style:"margin-top:12px;align-items:center;justify-content:space-between;gap:12px"}, [
        el("span", {text:t(o[1])}),
        el("div", {class:"seg", role:"group", "aria-label":t(o[1])}, [true,false].map(function(v){
          return el("button", {"aria-pressed": String(pr[o[0]] === v), text: t(v ? "notif_on" : "notif_off"), onclick:function(){ var p = notifPrefs(); p[o[0]] = v; setNotifPrefs(p); render(); syncPush(); }});
        }))
      ]));
    });
    s.appendChild(el("button", {class:"btn block ghost", style:"margin-top:14px", text:t("notif_disable"), onclick: disableNotifs}));
  }
  if (ui.notifErr) s.appendChild(el("p", {class:"err", role:"status", text:ui.notifErr}));
  return s;
}

/* --- Group chat --- */
var gchatDraft = "", gchatTimer = null, gchatTick = 0;
function fetchGroupChat(){
  if (!state.group || !state.onboardingDone) return;
  var code = state.group.code;
  api("/api/chat?group=" + encodeURIComponent(code) + "&me=" + encodeURIComponent(state.user.id), null, 15000).then(function(r){
    if (!state.group || state.group.code !== code) return;
    var prev = ui.gchat, next;
    if (r && Array.isArray(r.messages)) next = { status:"ok", messages: r.messages.filter(isObj), sending: prev.sending };
    else next = { status: prev.status === "ok" ? "ok" : "offline", messages: prev.messages, sending: prev.sending };
    var changed = next.status !== prev.status || next.messages.length !== prev.messages.length || (next.messages.length && next.messages[next.messages.length-1].at !== prev.messages[prev.messages.length-1].at);
    ui.gchat = next;
    if (changed && ui.tab === "group") updateGroupChat(true);
  });
}
function sendGroupChat(){
  var v = gchatDraft.trim();
  if (!v || !state.group || ui.gchat.sending) return;
  ui.gchat.sending = true; updateGroupChat(false);
  var code = state.group.code;
  // la fiche doit exister côté serveur avant d'écrire
  pushGroup(false).then(function(){ return api("/api/chat", { group: code, id: state.user.id, text: v }, 15000); }).then(function(r){
    ui.gchat.sending = false;
    if (r && r.ok){ gchatDraft = ""; ui.gchat.error = false; var ta = document.getElementById("gchat-in"); if (ta) ta.value = ""; fetchGroupChat(); }
    else ui.gchat.error = true;
    updateGroupChat(false);
  });
}
function gchatMessages(){
  var c = el("div", {class:"chat", id:"gchat", "aria-live":"polite"});
  var g = ui.gchat;
  if (g.status === "offline") c.appendChild(el("div", {class:"banner", role:"status", text:t("gchat_unavailable")}));
  else if (g.status !== "ok") c.appendChild(el("p", {class:"muted small"}, [el("span", {class:"spin"}), " ", t("loading")]));
  else if (!g.messages.length) c.appendChild(el("p", {class:"muted small", text:t("gchat_empty")}));
  g.messages.forEach(function(m){
    var time = ""; try { if (m.at) time = new Date(m.at).toLocaleTimeString(lang() === "en" ? "en-GB" : "fr-FR", {hour:"2-digit", minute:"2-digit"}); } catch(e){}
    if (m.me === true) c.appendChild(el("div", {class:"msg user"}, [el("div", {class:"who", text: t("group_you") + (time ? " · " + time : "")}), el("div", {text: str(m.text, 500)})]));
    else c.appendChild(el("div", {class:"msg peer"}, [el("div", {class:"who", text: str(m.name, 30) + (time ? " · " + time : "")}), el("div", {text: str(m.text, 500)})]));
  });
  if (g.error) c.appendChild(el("p", {class:"small", style:"color:var(--danger)", role:"alert", text:t("gchat_send_error")}));
  return c;
}
function groupChatSection(){
  var s = el("section", {class:"sect", id:"gchat-sect"}, [el("h2", {text:t("gchat_title")})]);
  s.appendChild(gchatMessages());
  var ta = el("textarea", {class:"in grow", id:"gchat-in", placeholder:t("gchat_placeholder"), "aria-label":t("gchat_placeholder"), maxlength:"500", value:gchatDraft, rows:"1"});
  ta.addEventListener("input", function(){ gchatDraft = ta.value; });
  ta.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendGroupChat(); } });
  s.appendChild(el("div", {class:"composer"}, [ta, el("button", {class:"btn primary", id:"gchat-send", disabled:!!ui.gchat.sending, text:t("mentor_send"), onclick:sendGroupChat})]));
  return s;
}
// Met à jour seulement la liste des messages : le champ de saisie garde le focus et le texte.
function updateGroupChat(scroll){
  var old = document.getElementById("gchat");
  if (!old) return;
  var atBottom = old.scrollHeight - old.scrollTop - old.clientHeight < 40;
  var fresh = gchatMessages();
  old.parentNode.replaceChild(fresh, old);
  var btn = document.getElementById("gchat-send"); if (btn) btn.disabled = !!ui.gchat.sending;
  if (scroll && atBottom) try { fresh.scrollTop = fresh.scrollHeight; } catch(e){}
}
function startGroupPolling(){
  if (gchatTimer) return;
  gchatTimer = setInterval(function(){
    if (ui.tab !== "group" || !state.group || document.hidden) return;
    fetchGroupChat();
    if (++gchatTick % 4 === 0) refreshGroup(true);
  }, 8000);
}

/* --- Account (pseudo + mot de passe, sauvegarde en ligne) --- */
var SESSION_KEY = "am_session_v1";
function readSession(){
  try { var s = JSON.parse(window.localStorage.getItem(SESSION_KEY) || "null"); return isObj(s) && typeof s.token === "string" && typeof s.username === "string" ? s : null; }
  catch(e){ return null; }
}
function writeSession(s){ try { if (s) window.localStorage.setItem(SESSION_KEY, JSON.stringify(s)); else window.localStorage.removeItem(SESSION_KEY); } catch(e){} }
var session = readSession(), cloudTimer = null, cloudBusy = false, dirtySeq = 0, acctUser = "", acctPass = "";
function accountCall(body){ return apiFull("/api/account", body); }
// Comme api() mais garde le code HTTP (identifiants faux, pseudo pris, code introuvable, hors ligne…).
function apiFull(path, body){
  return new Promise(function(resolve){
    var done = false, timer = setTimeout(function(){ if (!done){ done = true; resolve({status:0, json:null}); } }, 20000);
    try {
      fetch(path, { method:"POST", cache:"no-store", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) }).then(function(res){
        return res.text().then(function(txt){ var j = null; try { j = JSON.parse(txt); } catch(e){} return {status:res.status, json: isObj(j) ? j : null}; });
      }).then(function(r){ if (!done){ done = true; clearTimeout(timer); resolve(r); } }, function(){ if (!done){ done = true; clearTimeout(timer); resolve({status:0, json:null}); } });
    } catch(e){ done = true; clearTimeout(timer); resolve({status:0, json:null}); }
  });
}
function markDirty(){
  if (!session || !state || !state.onboardingDone) return;
  dirtySeq++;
  if (!session.dirty){ session.dirty = true; writeSession(session); }
  clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudSave, 3000);
}
function cloudSave(){
  if (!session || !state.onboardingDone) return;
  if (cloudBusy){ clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudSave, 3000); return; }
  cloudBusy = true;
  var token = session.token, seq = dirtySeq;
  accountCall({ action:"save", token: token, state: state }).then(function(r){
    cloudBusy = false;
    if (!session || session.token !== token) return;
    if (r.status === 200 && r.json && r.json.ok){
      session.syncedAt = str(r.json.updatedAt, 40);
      if (seq === dirtySeq) session.dirty = false;
      writeSession(session);
    } else if (r.status === 401) sessionExpired();
    if (ui.tab === "settings") updateAccountStatus();
  });
}
function sessionExpired(){ session = null; writeSession(null); toast("", t("account_expired")); if (ui.tab === "settings") render(); }
// Remplace les données du téléphone par celles du compte.
function applyCloudState(s, updatedAt){
  state = normalize(s); saveLocal();
  session.syncedAt = str(updatedAt, 40); session.dirty = false; writeSession(session);
  ui.obStep = 0; ui.obLogin = false; ui.tab = "today"; ui.unlock = null; ui.groupOpen = null;
  ui.group = {status:"idle", members:[]}; ui.gchat = {status:"idle", messages:[]};
  if (state.onboardingDone) refreshDay(true); else render();
  window.scrollTo(0,0);
}
function cloudSyncOnBoot(){
  if (!session) return;
  accountCall({ action:"load", token: session.token }).then(function(r){
    if (!session) return;
    if (r.status === 401) return sessionExpired();
    if (r.status !== 200 || !r.json) return;
    if (isObj(r.json.state) && !session.dirty && r.json.updatedAt !== session.syncedAt) applyCloudState(r.json.state, r.json.updatedAt);
    else if (session.dirty || !r.json.state) cloudSave();
  });
}
function accountError(r){
  var code = r.json && r.json.error;
  if (r.status === 401) return t("account_err_credentials");
  if (r.status === 429) return t("account_err_rate");
  if (code === "username_taken") return t("account_err_taken");
  if (code === "bad_username") return t("account_err_username");
  if (code === "bad_password") return t("account_err_password");
  return t("account_err_offline");
}
function accountSubmit(action){
  if (ui.acct.busy) return;
  ui.acct = { busy:true, err:"" }; render();
  var body = { action: action, username: acctUser.trim(), password: acctPass };
  if (action === "register" && state.onboardingDone) body.state = state;
  accountCall(body).then(function(r){
    ui.acct = { busy:false, err:"" };
    if (r.status !== 200 || !r.json || typeof r.json.token !== "string"){ ui.acct.err = accountError(r); render(); return; }
    acctPass = "";
    session = { token: r.json.token, username: str(r.json.username, 20), syncedAt: str(r.json.updatedAt, 40), dirty:false };
    writeSession(session);
    if (action === "login" && isObj(r.json.state)) applyCloudState(r.json.state, r.json.updatedAt);
    else { if (action === "login") markDirty(); ui.obLogin = false; render(); }
    toast("", t(action === "login" ? "account_logged_in" : "account_created", {name: session.username}));
  });
}
function accountForm(loginOnly){
  var u = el("input", {class:"in", value:acctUser, placeholder:t("account_username"), "aria-label":t("account_username"), autocomplete:"username", autocapitalize:"none", spellcheck:"false", maxlength:"20"});
  var p = el("input", {class:"in", type:"password", value:acctPass, placeholder:t("account_password"), "aria-label":t("account_password"), autocomplete: loginOnly ? "current-password" : "new-password", maxlength:"200"});
  u.addEventListener("input", function(){ acctUser = u.value; });
  p.addEventListener("input", function(){ acctPass = p.value; });
  p.addEventListener("keydown", function(e){ if (e.key === "Enter"){ e.preventDefault(); accountSubmit("login"); } });
  var busy = !!ui.acct.busy;
  var btns = loginOnly
    ? el("button", {class:"btn primary block", disabled:busy, text: busy ? t("loading") : t("account_login"), onclick:function(){ accountSubmit("login"); }})
    : el("div", {class:"two"}, [
        el("button", {class:"btn primary", disabled:busy, text:t("account_create"), onclick:function(){ accountSubmit("register"); }}),
        el("button", {class:"btn", disabled:busy, text:t("account_login"), onclick:function(){ accountSubmit("login"); }})
      ]);
  return el("div", {class:"stack"}, [u, p, btns,
    ui.acct.err ? el("p", {class:"err", role:"alert", text:ui.acct.err}) : null,
    el("p", {class:"small muted", text: loginOnly ? t("account_login_hint") : t("account_rules")})]);
}
function accountStatusText(){ return session && session.dirty ? t("account_syncing") : t("account_synced"); }
function updateAccountStatus(){ var n = document.getElementById("acct-status"); if (n) n.textContent = accountStatusText(); }
function accountSection(){
  var s = el("section", {class:"sect"}, [el("h2", {text:t("account_title")})]);
  if (session){
    s.appendChild(el("p", {style:"margin-top:8px", text:t("account_connected", {name: session.username})}));
    s.appendChild(el("p", {class:"small muted", id:"acct-status", text:accountStatusText()}));
    s.appendChild(el("button", {class:"btn ghost block", style:"margin-top:12px", text:t("account_logout"), onclick:function(){
      var token = session.token;
      if (session.dirty) cloudSave();
      accountCall({ action:"logout", token: token });
      session = null; writeSession(null); toast("", t("account_logged_out")); render();
    }}));
    return s;
  }
  s.appendChild(el("p", {class:"small muted", style:"margin:6px 0 12px", text:t("account_pitch")}));
  s.appendChild(accountForm(false));
  return s;
}

/* --- Settings --- */
function viewSettings(){
  var box = el("div");
  box.appendChild(el("section", {}, [el("h2", {text:t("settings_lang"), style:"margin-bottom:12px"}), langSeg()]));
  box.appendChild(accountSection());
  box.appendChild(notifSection());
  var gs = el("section", {class:"sect"}, [el("h2", {text:t("group_title")})]);
  gs.appendChild(groupJoinUI(function(){ render(); }));
  box.appendChild(gs);
  // tasks
  var ts = el("section", {class:"sect"}, [el("h2", {text:t("settings_tasks")})]);
  var act = state.tasks.filter(function(x){ return x.active; });
  act.forEach(function(tk){
    if (ui.settingsPanel && ui.settingsPanel.edit === tk.id){
      var d = ui.settingsPanel.draft;
      ts.appendChild(el("div", {class:"card", style:"margin-top:8px"}, [el("h3", {text:pillarName(tk.pillar)}), taskEditor(d), el("div", {class:"row", style:"margin-top:12px"}, [
        el("button", {class:"btn primary grow", text:t("save"), onclick:function(){ if (!d.title.trim()) return; var v = value(d.difficulty, d.minutes); state.tasks = state.tasks.map(function(x){ if (x.id !== tk.id) return x; var y = JSON.parse(JSON.stringify(x)); y.title = d.title.trim().slice(0,140); y.freq = normFreq(d.freq); y.difficulty = d.difficulty; y.minutes = d.minutes; y.points = v.points; y.penalty = v.penalty; return y; }); ui.settingsPanel = null; save(); render(); }}),
        el("button", {class:"btn ghost", text:t("cancel"), onclick:function(){ ui.settingsPanel = null; render(); }})
      ])]));
      return;
    }
    var armed = ui.settingsPanel && ui.settingsPanel.deact === tk.id;
    ts.appendChild(el("div", {class:"note"}, [
      el("div", {style:"font-weight:600", text:taskTitle(tk)}),
      el("div", {class:"small muted", text: pillarName(tk.pillar) + " · " + freqLabel(tk.freq) + " · +" + tk.points + " / −" + tk.penalty}),
      tk.system ? el("p", {class:"small muted", style:"margin-top:4px", text:t("ame_not_editable")}) : el("div", {class:"row", style:"margin-top:8px"}, [
        el("button", {class:"btn sm", text:t("edit"), onclick:function(){ ui.settingsPanel = { edit:tk.id, draft:{ pillar:tk.pillar, title:tk.title, freq:normFreq(tk.freq), difficulty:tk.difficulty, minutes:tk.minutes } }; render(); }}),
        el("button", {class:"btn sm " + (armed ? "danger" : "ghost"), text: armed ? t("confirm_tap") : t("settings_task_deactivate"), onclick:function(){
          if (!armed){ ui.settingsPanel = { deact:tk.id }; render(); return; }
          var td = today();
          state.tasks = state.tasks.map(function(x){ if (x.id !== tk.id) return x; var y = JSON.parse(JSON.stringify(x)); y.active = false; y.deactivatedAt = td; return y; });
          ui.settingsPanel = null; ui.unlock = null; save(); render(); schedulePush();
        }})
      ])
    ]));
  });
  box.appendChild(ts);
  // export / import
  var exportTxt = ""; try { exportTxt = JSON.stringify(state, null, 1); } catch(e){}
  var io = el("section", {class:"sect stack"}, [el("h2", {text:t("settings_data")}),
    el("div", {class:"two"}, [
      el("button", {class:"btn", text:t("settings_export_file"), onclick:function(){
        try { var blob = new Blob([JSON.stringify(state, null, 1)], {type:"application/json"}); var a = el("a", {href:URL.createObjectURL(blob), download:"anti-moldu-" + today() + ".json"}); document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
        catch(e){ toast("", t("error_generic")); }
      }}),
      el("button", {class:"btn", "aria-pressed":String(ui.settingsPanel && ui.settingsPanel.text === true), text:t("settings_export_text"), onclick:function(){ ui.settingsPanel = ui.settingsPanel && ui.settingsPanel.text ? null : { text:true }; render(); }})
    ])

  }

  }
  file.addEventListener("change", function(){ var f = file.files && file.files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function(){ doImport(String(rd.result || "")); }; rd.onerror = function(){ msg.textContent = t("settings_import_bad"); }; rd.readAsText(f); });
  io.appendChild(el("h3", {text:t("settings_import"), style:"margin-top:20px"}));

  io.appendChild(el("div", {class:"two"}, [el("button", {class:"btn", text:t("settings_import_btn"), onclick:function(){ doImport(imp.value); }}), el("button", {class:"btn", text:t("settings_import_file"), onclick:function(){ file.click(); }})]));
  io.appendChild(file); io.appendChild(msg);
  box.appendChild(io);
  // reset
  box.appendChild(el("section", {class:"sect"}, [el("h2", {text:t("settings_reset")}), el("p", {class:"small muted", style:"margin:6px 0 12px", text:t("settings_reset_hint")}),

    }})]));

/* ================= DAY / RANK REFRESH ================= */
function fetchMorning(){
  if (!state.onboardingDone || ui.morningBusy) return;
  var td = today();
  if (state.coach.morning && state.coach.morning.date === td) return;
  ui.morningBusy = true;
  askCoach("morning").then(function(r){
    ui.morningBusy = false;
    state.coach.morning = { date: td, text: r.text };
    save();
    if (state.onboardingDone && ui.tab === "today"){ var y = window.scrollY; render(); window.scrollTo(0,y); }
  });
}
function refreshDay(silent){
  if (!state.onboardingDone) return;
  var td = today();
  var dayChanged = td !== currentDay;
  currentDay = td;
  try {
    var r = L.evaluateRank(state, td);
    var events = (r && r.events) || [];
    state = r.state;
    if (events.length) state = L.applyDownEvents(state, events, td);
    save();
    var last = events.length ? events[events.length - 1] : null;
    if (last && last.type === "up" && !silent) ui.celebrate = state.rank.index;
    if (events.length || dayChanged){ ui.unlock = null; ui.view = "today"; }
    if (events.some(function(e){ return e.type === "down"; })){ ui.regressionText = null; }
  } catch(e){
    loadNotice = loadNotice || null;
  }
  render();
  fetchMorning();
  syncPush();
  if (state.group) refreshGroup();
}
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") refreshDay(); });
setInterval(function(){ if (today() !== currentDay) refreshDay(); }, 60000);

/* ---------- boot ---------- */
if (!L){
  app.appendChild(el("div", {class:"wrap", style:"padding-top:40px"}, [el("h2", {text:t("error_generic")}), el("p", {class:"muted", text:t("error_generic")})]));
  return;
}
saveLocal();
if (inviteCode && state.group && state.group.code === inviteCode) inviteCode = null;
if (inviteCode && state.onboardingDone) ui.tab = "group";
else if (openTab && state.onboardingDone) ui.tab = openTab;
if (state.onboardingDone) refreshDay(); else render();
if (ui.tab === "group"){ fetchGroupChat(); startGroupPolling(); }
cloudSyncOnBoot();
})();
